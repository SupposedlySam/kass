<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kass</title>
    <script>
      (() => {
        try {
          let theme = 'system';
          // Before the storage keys move (carryOverStorage.ts), the theme is under an old name.
          const raw = localStorage.getItem('kass-ui') || localStorage.getItem('herga-ui') || localStorage.getItem('voicebox-ui');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed?.state?.theme) theme = parsed.state.theme;
          }
          const resolved = theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
